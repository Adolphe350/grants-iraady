version: "3.8"
services:
  grants:
    build: ./app
    container_name: grants-iraady
    restart: unless-stopped
    ports:
      - "5041:5000"
    volumes:
      - grants_data:/data
    environment:
      - INGEST_SECRET=uwezogrants2026
      - SITE_PASSWORD=Kigali2020@
      - SECRET_KEY=g4r4nts-kigali-session-2026
      # FFN credentials come from Coolify env vars (NOT committed to git)
      - FFN_USER=${FFN_USER}
      - FFN_PASS=${FFN_PASS}
      - ENABLE_SCHEDULER=1
    healthcheck:
      # python is guaranteed in the playwright base image (wget/curl are not)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "coolify.managed=true"

volumes:
  grants_data:
