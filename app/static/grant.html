<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant · Grants Iraady</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('gi-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313294B'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23fff' stroke-opacity='.5' stroke-width='1.6'/%3E%3Cpath d='M16 16L24 9' stroke='%23D9911A' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23D9911A'/%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/public-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <div class="main">
    <main id="main" class="page d-pad" tabindex="-1" aria-busy="true">
      <div class="d-head"><span class="sk" style="width:120px;margin-bottom:18px"></span><span class="sk" style="width:70%;height:30px;margin-bottom:12px"></span><span class="sk" style="width:30%"></span></div>
    </main>
    <footer class="foot">Built by Iraady Ltd · <a href="https://iraady.com" rel="noopener">iraady.com</a> · <a href="/fundnest/privacy">Fund Nest privacy</a></footer>
  </div>
</div>
<script src="/static/shell.js"></script>
<script>
(function () {
  'use strict';
  var GI = window.GI, esc = GI.esc, icon = GI.icon, main = document.getElementById('main');
  GI.mountShell('all');
  var slug = decodeURIComponent(location.pathname.replace(/^\/grant\//, '').replace(/\/$/, ''));
  var back = '/?view=all';
  try { var l = sessionStorage.getItem('gi-last'); if (l && l.charAt(0) === '/') back = l; } catch (e) {}

  function fail(title, msg) {
    document.title = title + ' · Grants Iraady';
    main.innerHTML = '<div class="crumbs"><a href="' + esc(back) + '">' + icon('back') + 'Back to grants</a></div><div class="panel empty"><div class="art">' + icon('alert') + '</div><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><a class="btn btn-primary" href="/?view=all">Browse all grants</a></div>';
    main.setAttribute('aria-busy', 'false');
  }
  function fact(label, value, small) {
    if (!value) return '';
    return '<div class="f"><dt>' + label + '</dt><dd>' + value + (small ? '<small>' + small + '</small>' : '') + '</dd></div>';
  }

  GI.get('/api/grant/' + encodeURI(slug)).then(function (g) {
    var d = GI.deadline(g), sz = GI.sizeText(g);
    var applyUrl = /^https?:\/\//i.test(g.apply_url || '') && !/fundsforngo/i.test(g.apply_url) ? g.apply_url : '';
    var countries = (g.countries || '').split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x && x !== 'Global'; });
    var cShown = countries.length > 6 ? countries.slice(0, 6).join(', ') + ' +' + (countries.length - 6) + ' more' : countries.join(', ');
    document.title = g.title + ' · Grants Iraady';

    var dlWhen = g.deadline_iso ? GI.fmtDate(g.deadline_iso) : 'No fixed deadline';
    var chips = GI.chip(g, true) +
      (g.category ? '<span class="chip chip-lg chip-plain">' + icon('tag') + esc(g.category) + '</span>' : '') +
      (sz ? '<span class="chip chip-lg chip-size">' + esc(sz) + '</span>' : '') +
      (GI.isNew(g) && !d.past ? '<span class="chip chip-lg chip-green">New this week</span>' : '');

    var applyBtn = applyUrl
      ? '<a class="btn btn-primary btn-lg" href="' + esc(applyUrl) + '" target="_blank" rel="noopener noreferrer">Apply on funder’s site' + icon('ext') + '</a>'
      : '';
    var applyNote = applyUrl
      ? '<p>Opens the funder’s own page in a new tab.</p>'
      : '<p>No direct apply link was captured for this grant. Read “How to apply” in the details.</p>';

    var body = '';
    var desc = g.description || '', full = g.full_text || '';
    var plain = function (h) { return String(h).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase(); };
    var dupe = desc && full && plain(full).indexOf(plain(desc).slice(0, 80)) >= 0;
    if (desc && !dupe) body += '<h2 class="sec">Summary</h2><div class="lead">' + GI.sanitize(desc) + '</div>';
    if (full) body += '<h2 class="sec">Full details</h2>' + GI.sanitize(full);
    if (!body) body = '<p>No description was captured for this grant.</p>';

    main.innerHTML =
      '<div class="crumbs"><a href="' + esc(back) + '">' + icon('back') + 'Back to grants</a></div>' +
      '<header class="d-head"><div class="chips">' + chips + '</div><h1>' + esc(g.title) + '</h1>' +
      '<p class="by">' + icon('building') + '<span>' + esc(g.donor || 'Unknown funder') + '</span></p></header>' +
      '<div class="d-grid"><article class="read" aria-label="Grant details">' + body + '</article>' +
      '<aside class="d-aside" aria-label="Key facts">' +
      '<section class="panel facts-card"><div class="panel-head"><h2>Key facts</h2></div><dl>' +
        fact('Deadline', esc(dlWhen), d.days !== null && !d.past ? esc(d.text.replace('Closes ', 'Closes ')) : (d.past ? 'Closed' : 'Rolling basis')) +
        fact('Grant size', sz ? esc(sz) : '', '') +
        fact('Funder', esc(g.donor || '')) +
        fact('Region', esc(g.region || 'Global')) +
        fact('Countries', esc(cShown)) +
        fact('Who can apply', esc(g.eligible_org || '')) +
        fact('Category', esc(g.category || '')) +
        fact('Posted', esc(g.posted_date || '')) +
      '</dl></section>' +
      '<section class="panel apply-card">' + applyBtn + '<button class="btn" id="copy" type="button">' + icon('copy') + 'Copy link</button>' + applyNote + '</section>' +
      '</aside></div>' +
      '<div class="sticky-apply">' + (applyUrl ? '<a class="btn btn-primary" href="' + esc(applyUrl) + '" target="_blank" rel="noopener noreferrer">Apply on funder’s site' + icon('ext') + '</a>' : '') + '<button class="btn" id="copy2" type="button" aria-label="Copy link">' + icon('copy') + '</button></div>';
    main.setAttribute('aria-busy', 'false');
    var copy = function () {
      var url = location.href, ok = function () { GI.toast('Link copied'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function () { prompt('Copy this link', url); });
      else { var t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { prompt('Copy this link', url); } t.remove(); }
    };
    document.getElementById('copy').onclick = copy; document.getElementById('copy2').onclick = copy;
  }).catch(function (e) {
    if (e.status === 404) fail('Grant not found', 'This grant is not in the database. It may have been removed.');
    else fail('Could not load this grant', 'The server did not answer. Try again in a moment.');
  });
})();
</script>
</body>
</html>
